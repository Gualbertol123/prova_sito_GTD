name: CI

# Type-check, test and build the web app on every push and pull request, so a
# broken change is caught here before Netlify deploys it.
on:
  push:
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          # The build refuses to run without one (vite.config.ts); any address
          # will do here, since this copy is never deployed.
          VITE_TEAM_EMAIL: ci@example.invalid
