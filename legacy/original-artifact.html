<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function() {
  const SUPABASE_URL = 'https://gqknbcsctpcowfnkijha.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_HNSykQXHWSbTilOkOh4hVA_rsGXgDcE';
  const TRACKED_KEYS = new Set([
    'team-gtd-tasks-v2',
    'team-gtd-name',
    'team-gtd-group',
    'team-gtd-members',
    'weekly-review-data-v2'
  ]);

  function safeJSON(value, fallback) {
    try { return value ? JSON.parse(value) : fallback; } catch { return fallback; }
  }

  function snapshot() {
    return {
      tasks: safeJSON(localStorage.getItem('team-gtd-tasks-v2'), []),
      teamName: localStorage.getItem('team-gtd-name') || 'TEAM GTD FINALE',
      groupName: localStorage.getItem('team-gtd-group') || 'Progetti Commercial Planning',
      teamMembers: safeJSON(localStorage.getItem('team-gtd-members'), ['Francesco','Chiara','Gonzalo','Gualberto']),
      weeklyItems: safeJSON(localStorage.getItem('weekly-review-data-v2'), null)
    };
  }

  function applyRemote(data) {
    if (!data) return;
    syncingRemote = true;
    try {
      if (data.tasks !== undefined) localSetItem('team-gtd-tasks-v2', JSON.stringify(data.tasks));
      if (data.teamName !== undefined) localSetItem('team-gtd-name', String(data.teamName));
      if (data.groupName !== undefined) localSetItem('team-gtd-group', String(data.groupName));
      if (data.teamMembers !== undefined) localSetItem('team-gtd-members', JSON.stringify(data.teamMembers));
      if (data.weeklyItems !== undefined && data.weeklyItems !== null) localSetItem('weekly-review-data-v2', JSON.stringify(data.weeklyItems));

      // The React app already listens for changes to this key and refreshes its state.
      window.dispatchEvent(new StorageEvent('storage', {
        key: 'team-gtd-tasks-v2',
        oldValue: null,
        newValue: localStorage.getItem('team-gtd-tasks-v2'),
        storageArea: localStorage,
        url: location.href
      }));
    } finally {
      syncingRemote = false;
    }
  }

  let syncingRemote = false;
  let saveTimer = null;
  let saveToSupabase = null;
  const nativeSetItem = Storage.prototype.setItem;
  const localSetItem = function(key, value) { nativeSetItem.call(localStorage, key, value); };

  Storage.prototype.setItem = function(key, value) {
    nativeSetItem.call(this, key, value);
    if (this === localStorage && TRACKED_KEYS.has(key) && !syncingRemote) scheduleSave();
  };

  function scheduleSave() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(saveToSupabase, 300);
  }

  async function run() {
    if (!window.supabase || !window.supabase.createClient) {
      console.error('Supabase library failed to load.');
      return;
    }

    const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const params = new URLSearchParams(location.search);
    let boardToken = params.get('board');

    if (!boardToken) {
      boardToken = crypto.randomUUID();
      const next = location.pathname + '?board=' + encodeURIComponent(boardToken);
      history.replaceState(null, '', next);
    }

    const channel = client.channel('board-' + boardToken, { config: { broadcast: { self: false } } });

    saveToSupabase = async function() {
      if (syncingRemote) return;
      const data = snapshot();
      const { error } = await client
        .from('boards')
        .update({ data, updated_at: new Date().toISOString() })
        .eq('share_token', boardToken);
      if (error) console.error('Supabase save error:', error);
      else {
        const result = await channel.send({
          type: 'broadcast',
          event: 'state-update',
          payload: { data }
        });
        if (result !== 'ok') console.error('Supabase broadcast error:', result);
      }
    }

    // Load shared state first; create the board from the current local state if it does not exist.
    const { data: row, error: readError } = await client
      .from('boards')
      .select('id, data')
      .eq('share_token', boardToken)
      .maybeSingle();

    if (readError) {
      console.error('Supabase load error:', readError);
    } else if (row) {
      applyRemote(row.data);
    } else {
      const { error: insertError } = await client
        .from('boards')
        .insert({ share_token: boardToken, data: snapshot() });
      if (insertError) console.error('Supabase create board error:', insertError);
    }

    channel
      .on('broadcast', { event: 'state-update' }, ({ payload }) => {
        if (payload && payload.data) applyRemote(payload.data);
      })
      .subscribe(status => {
        if (status !== 'SUBSCRIBED') console.log('Realtime channel status:', status);
      });

    window.__teamGtdSupabase = { client, boardToken, saveToSupabase };

    console.log('Realtime board ready:', location.href);
  }

  // Wait until the browser has the Supabase client available, then initialize.
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', run, { once: true });
  else run();
})();
</script>
