# Netlify build configuration for the TEAM GTD React app.
# The frontend lives in web/ and talks directly to Supabase — there is no
# server to deploy here.

[build]
  command = "npm --prefix web install && npm --prefix web run build"
  publish = "web/dist"

[build.environment]
  NODE_VERSION = "20"

# Server-side PDF for the weekly report (web/netlify/functions/report-pdf.mts).
[functions]
  directory = "web/netlify/functions"
  node_bundler = "esbuild"
  # Shipped as-is rather than bundled: its internal font imports break when bundled.
  external_node_modules = ["@react-pdf/renderer"]
  # pdfkit loads its built-in font data with require(), which Netlify's file
  # tracing does not follow: without these the function crashes (502).
  included_files = ["web/node_modules/pdfkit/js/standard-fonts/**", "web/node_modules/pdfkit/js/data/**"]

# Single-page app: serve index.html for any path.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Hashed build assets never change content under the same filename, so they
# can be cached for good.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Never let the browser cache the HTML shell — everything is remote/live.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-store"

# Keep the whole site out of search engines, and apply browser security headers
# to every response: HTTPS-only (HSTS), no framing (clickjacking), no MIME
# sniffing, no referrer leaks to third parties, and a Content Security Policy
# that only allows this site's own scripts, Supabase (REST + realtime) and
# Google Fonts. img-src allows https: because the logo may be an external link;
# data:/blob: fonts and images are used when the report is captured as a PDF.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive, nosnippet"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
    Cross-Origin-Opener-Policy = "same-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; worker-src 'self' blob:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
